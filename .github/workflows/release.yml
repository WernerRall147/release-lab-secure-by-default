name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.1 (must be new: releases are immutable)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate the request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::releases are only built from main"
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Stamp the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" app/__init__.py
          grep -n '^__version__' app/__init__.py

      - name: Install pinned dependencies and run the tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q

      - name: Build the wheel and the source distribution
        run: python -m build --no-isolation --outdir dist

      - name: Install the wheel into a clean environment (this is what the SBOM describes)
        run: |
          python -m venv --without-pip sbom-env
          python -m pip --disable-pip-version-check --python sbom-env/bin/python install -r requirements.txt dist/*.whl

      - name: Generate the SBOM (SPDX 2.3 JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-env
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest-and-release:
    name: attest-and-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # request the short-lived signing identity
      attestations: write # store the signed attestations
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Attest the build provenance (who built what, from which commit)
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-files/*.whl
            release-files/*.tar.gz

      - name: Attest the SBOM (what is inside)
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-files/*.whl
            release-files/*.tar.gz
          sbom-path: release-files/sbom.spdx.json

      - name: Publish the release (draft, attach files, then publish)
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          cp "$PROVENANCE_BUNDLE" release-files/provenance.intoto.jsonl
          cp "$SBOM_BUNDLE" release-files/sbom.intoto.jsonl
          cat > release-notes.md <<EOF
          Demo release of the fictional Payments Status API (synthetic data only).

          Verify what was built (requires the GitHub CLI):

              gh attestation verify <wheel-file> --repo ${GITHUB_REPOSITORY}
              gh attestation verify <wheel-file> --repo ${GITHUB_REPOSITORY} --predicate-type https://spdx.dev/Document/v2.3
          EOF
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" \
            --notes-file release-notes.md --generate-notes
          gh release upload "$tag" release-files/*
          gh release edit "$tag" --draft=false --latest

      - name: Verify the published wheel (the same check a consumer would run)
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mkdir verify
          gh release download "$tag" --dir verify --pattern '*.whl'
          gh attestation verify verify/*.whl --repo "$GITHUB_REPOSITORY"
          gh attestation verify verify/*.whl --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3
          {
            echo "### Release v${VERSION} published"
            echo
            echo "Verify it yourself:"
            echo
            echo '```'
            echo "gh release download v${VERSION} --repo ${GITHUB_REPOSITORY} --pattern '*.whl'"
            echo "gh attestation verify <wheel-file> --repo ${GITHUB_REPOSITORY}"
            echo "gh attestation verify <wheel-file> --repo ${GITHUB_REPOSITORY} --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
